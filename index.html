<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>자리 자동 배치</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 30px;
    }

    button:hover {
      background: #3730a3;
    }

    .classroom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .row {
      display: grid;
      gap: 15px;
    }

    .row-2 {
      grid-template-columns: repeat(2, 100px);
    }

    .row-4 {
      grid-template-columns: repeat(4, 100px);
    }

    .seat {
      background: white;
      border-radius: 12px;
      padding: 25px 10px;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h1>🎲 자리 자동 배치</h1>

  <button onclick="shuffleSeats()">자리 섞기</button>

  <div class="classroom" id="classroom"></div>

  <script>
    const classroom = document.getElementById("classroom");

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function shuffleSeats() {
      let numbers = [];

      for (let i = 1; i <= 18; i++) {
        numbers.push(i);
      }

      shuffle(numbers);

      classroom.innerHTML = "";

      // 자리 구조
      const layout = [2, 4, 4, 4, 4];

      let index = 0;

      layout.forEach(count => {
        const row = document.createElement("div");
        row.className = count === 2 ? "row row-2" : "row row-4";

        for (let i = 0; i < count; i++) {
          const seat = document.createElement("div");
          seat.className = "seat";
          seat.textContent = numbers[index++];
          row.appendChild(seat);
        }

        classroom.appendChild(row);
      });
    }

    // 처음 실행
    shuffleSeats();
  </script>

</body>
</html>
