<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쓰싹쓰싹 - 분리배출 검색 서비스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 좌측 주요 기능 영역 -->
    <main class="left-section">
      <header class="header">
        <h1>쓰싹쓰싹</h1>
      </header>

      <section class="search-section">
        <div class="search-box">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="분리배출 종류 입력 (예: 생수병, 박스, 건전지)"
            autocomplete="off"
          >
          <button id="searchBtn" aria-label="검색">🔍</button>
        </div>
      </section>

      <section class="result-section">
        <div id="resultCard" class="result-card empty">
          <p class="placeholder-text">검색어를 입력하거나 우측 목록에서 항목을 선택해 보세요.</p>
        </div>
      </section>
    </main>

    <!-- 우측 추가 컨텐츠 영역 (제미나이 마음대로) -->
    <aside class="right-section">
      <div class="info-card">
        <h2>🌱 올바른 분리배출 4대 원칙</h2>
        <ul>
          <li><strong>비운다:</strong> 용기 안의 내용물은 깨끗이 비우기</li>
          <li><strong>헹군다:</strong> 이물질, 음식물 등은 씻어서 배출하기</li>
          <li><strong>분리한다:</strong> 라벨, 뚜껑 등 다른 재질은 제거하기</li>
          <li><strong>섞지 않는다:</strong> 종류별, 재질별로 구분하여 배출하기</li>
        </ul>
      </div>

      <div class="item-list-card">
        <h3>📦 전체 배출 품목 보기</h3>
        <p class="sub-text">클릭하면 배출 방법을 빠르게 확인할 수 있습니다.</p>
        <div id="categoryChips" class="chip-container">
          <!-- JS로 카테고리 칩 버튼들이 생성됩니다 -->
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
